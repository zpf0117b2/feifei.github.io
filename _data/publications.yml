  authors: "Yutong Song, Chenhan Lyu, Pengfei Zhang, Sabine Brunswicker, Nikil Dutt, Amir M. Rahmani"
  description: >-
    A retrieval-augmented generation framework that improves conversations with
    mild-stage dementia patients by integrating multiple knowledge graphs with LLMs.
  links:
    - label: preprint
      url: https://openreview.net/pdf?id=m7KkNKMDVp

- project: III
