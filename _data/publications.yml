  venue: "AMIA 2025 (Oral)"
  image: /pubimages/C_adaptiveRetrieval.jpg
  authors: "Pengfei Zhang, Mohbat Fnu, Yutong Song, Oshani Seneviratne, Zhongqi Yang, Iman Azimi, Amir M. Rahmani"
