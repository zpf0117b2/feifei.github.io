- project: I
  ref: I.b
  title: "Contextual Gesture: Co-Speech Gesture Video Generation through Context-aware Gesture Representation"
  venue: "ACM MM 2025"
  image: /pubimages/C_cospeech.png
  authors: "Pinxin Liu, Pengfei Zhang, Hyeongwoo Kim, Pablo Garrido, Ari Shapiro, Kyle Olszewski"
  description: >-
    Improves co-speech gesture video generation through chronological
    speech-gesture alignment that temporally connects the two modalities, and a
    contextualized gesture tokenization that folds speech context into motion
    pattern representation through distillation.
  links:
    - label: project
      url: https://andypinxinliu.github.io/Contextual-Gesture/
    - label: preprint
      url: https://arxiv.org/abs/2502.07239

- project: I
  ref: I.a
  title: "Handformer2T: A Lightweight Regression-based Model for Interacting Hands Pose Estimation from a Single RGB Image"
  venue: "WACV 2024"
  image: /pubimages/C_handformer2t.jpg
  authors: "Pengfei Zhang, Deying Kong"
  description: >-
    A lightweight model using hand-level tokenization in a transformer-based
    architecture for interacting hand pose estimation, where only one token is
    used per hand.
  links:
    - label: paper
      url: https://openaccess.thecvf.com/content/WACV2024/html/Zhang_Handformer2T_A_Lightweight_Regression-Based_Model_for_Interacting_Hands_Pose_Estimation_WACV_2024_paper.html

# --------------------------------------------------------------- Project II
- project: II
  ref: II.f
  title: "AP-GRPO: Anchor-Gated Phonetic Alignment with Policy Optimization for Pathological Speech Reconstruction"
  venue: "EMNLP 2026 (accepted)"
  image: /pubimages/C_apgrpo.png
  description: >-
    A GRPO framework with a phonetic reward that aligns speech language models to
    the original speech signal through audible-anchor preservation and inter-anchor
    phonetic compatibility, combining an anchor-gated reward that matches anchors in
    clear regions with an inter-anchor phonetic alignment reward that checks whether
    recovered content is phonetically supported by the corrupted span.
  links:
    - label: preprint
      url: https://arxiv.org/abs/2606.15540

- project: II
  ref: II.e
  title: "DemMA: Dementia Multi-Turn Dialogue Agent with Expert-Guided Reasoning and Action Simulation"
  venue: "ACL 2026"
  image: /pubimages/C_demma.png
  description: >-
    An expert-guided multi-turn dialogue agent that simulates dementia patients with
    clinically grounded personas by distilling expert-guided reasoning and action
    simulation.
  links:
    - label: paper
      url: https://aclanthology.org/2026.findings-acl.605/
    - label: code
      url: https://github.com/RainieLLM/DemMA
    - label: data
      url: https://huggingface.co/datasets/hulehule/DemMA-Dialog

- project: II
  ref: II.d
  title: "MedSpeak: Knowledge Enhanced ASR Error Correction Framework for Spoken Medical Question Answering"
  venue: "ICASSP 2026"
  image: /pubimages/C_medspeak.jpg
  description: >-
    A knowledge-enhanced retrieval-augmented generation framework built on a
    knowledge graph capturing semantic medical relationships and phonetic
    similarities between medical terms.
  links:
    - label: preprint
      url: https://arxiv.org/html/2602.00981v1
    - label: code
      url: https://github.com/RainieLLM/MedSpeak

- project: II
  ref: II.c
  title: "AudioLens: Multi-Perspective Speech Clustering with Audio-Language Models"
  venue: "Under Review"
  image: /pubimages/C_audiolens.png
  description: >-
    Introduces audio multi-perspective clustering, where a model partitions speech
    recordings according to a natural-language perspective while inferring both the
    number of clusters and their assignments. Contributes AudioLens-Bench, a
    benchmark evaluating cross-perspective generalization, and AudioLens-R1, a large
    audio-language model trained with reasoning distillation and direct preference
    optimization.

- project: II
  ref: II.b
  title: "From Sounds to Scenes: A Benchmark for Evaluating Context-Aware Auditory Scene Understanding in Large Audio Language Models"
  venue: "Under Review"
  image: /pubimages/C_soundsToScenes.png
  description: >-
    A benchmark evaluating whether large audio-language models can jointly interpret
    speech, events and scene-level information to perform coherent semantic reasoning.
  links:
    - label: preprint
      url: https://arxiv.org/abs/2606.25391

- project: II
  ref: II.a
  title: "Hallucination Rates of Speech Language Models on Pathological Speech Recognition: A Pilot Multi-Cohort Audit"
  venue: "BSN 2025"
  image: /pubimages/C_hallucinationAudit.png
  description: >-
    An evaluation of popular speech language models on pathological speech
    recognition across hallucination types: insertion, fluent completion, entity
    fabrication and semantic substitution.

# -------------------------------------------------------------- Project III
- project: III
  ref: III.c
  title: "Can the Environment Speak for Itself? T2-GRPO: Turn-Trajectory Group Relative Policy Optimization for Caregiver Agents"
  venue: "Under Review"
  image: /pubimages/C_t2grpo.png
  description: >-
    A turn-trajectory optimization scheme for long-horizon caregiver agents that
    derives dense turn-level rewards from patient-state transitions, normalizes them
    separately from trajectory-level outcomes via centered-rank group-relative
    advantages, and adds a binary safety veto to enforce hard behavioral constraints.

- project: III
  ref: III.b
  title: "DEMENTIA-PLAN: An Agent-Based Framework for Multi-Knowledge Graph Retrieval-Augmented Generation in Dementia Care"
  venue: "AAAI 2025"
