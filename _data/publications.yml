# Publications for /academic/ and /main/, transcribed from the RESEARCH PROJECTS
# section of files/PengfeiZhang_resume2.pdf.
#
# ORDER MATTERS. Entries render top-to-bottom within their project, so they are
# listed newest-first, matching the resume letters descending (..., c, b, a).
#
# Fields:
#   project     required. Matches an id: in _data/projects.yml.
#   ref         resume label such as I.e. Shown as a small badge; the resume's
#               Working Experience section cross-references these.
#   title       required.
#   venue       optional. Shown in green italics.
#   image       optional. Entries without one render full width.
#   description optional. Rendered as a short paragraph.
#   links       optional. List of label/url pairs. Relative URLs starting with /
#               resolve against baseurl.
#   authors     retained as data but NOT rendered - see _includes/publication.html.

# ---------------------------------------------------------------- Project I
- project: I
  ref: I.e
  title: "Identity Decay in Multi-Turn Human-Centric Image Editing: A Benchmark and a Multimodal Agentic Correction Framework"
  venue: "Under Review"
  image: /pubimages/C_identityDecay.png
  description: >-
    Introduces a benchmark measuring identity and fidelity decay in multi-turn
    human-centric image editing, and an identity correction pipeline in which a
    multimodal agent orchestrates pretrained human segmentation and parsing models
    (Sapiens for body, DML_CSR for face) together with deterministic image
    operators such as TPS warp and high-frequency transfer. The pipeline raises the
    ArcFace score by 0.192/0.201/0.246 on turns 1/2/3.

- project: I
  ref: I.d
  title: "KinMo: Kinematic-aware Human Motion Understanding and Generation"
  venue: "ICCV 2025"
  image: /pubimages/C_kinmo.jpg
  authors: "Pengfei Zhang, Pinxin Liu, Pablo Garrido, Hyeongwoo Kim, Bindita Chaudhuri"
  description: >-
    A VLM-based dataset enhancement pipeline that extends existing motion datasets
    through knowledge distillation, plus a hierarchical motion-text alignment
    approach that gradually fuses motion details into text semantics. It improves
    SOTA text-motion understanding (R@1 of 0.729/0.730 on motion-text
    inter-retrieval) and text-based motion generation (R@1 of 0.532) with more
    precise motion control.
  links:
    - label: project
      url: https://andypinxinliu.github.io/KinMo/
    - label: preprint
      url: https://arxiv.org/abs/2411.15472
    - label: demo
      url: https://andypinxinliu.github.io/KinMo/static/videos/KinMo-Demo.mp4

- project: I
  ref: I.c
  title: "LLM-Based Human-Agent Collaboration and Interaction Systems: A Survey"
  venue: "ACL 2026"
  image: /pubimages/C_humanAgentSurvey.png
  links:
    - label: project
      url: https://github.com/HenryPengZou/Awesome-Human-Agent-Collaboration-Interaction-Systems
    - label: paper
      url: https://aclanthology.org/2026.findings-acl.1811/

- project: I
  ref: I.b
  title: "Contextual Gesture: Co-Speech Gesture Video Generation through Context-aware Gesture Representation"
  venue: "ACM MM 2025"
  image: /pubimages/C_cospeech.png
  authors: "Pinxin Liu, Pengfei Zhang, Hyeongwoo Kim, Pablo Garrido, Ari Shapiro, Kyle Olszewski"
  description: >-
    Improves co-speech gesture video generation through chronological
    speech-gesture alignment that temporally connects the two modalities, and a
    contextualized gesture tokenization that folds speech context into motion
    pattern representation through distillation. It reduces FGD to 8.76 and FVD to
    466.43.
  links:
    - label: project
      url: https://andypinxinliu.github.io/Contextual-Gesture/
    - label: preprint
      url: https://arxiv.org/abs/2502.07239

- project: I
  ref: I.a
  title: "Handformer2T: A Lightweight Regression-based Model for Interacting Hands Pose Estimation from a Single RGB Image"
  venue: "WACV 2024"
  image: /pubimages/C_handformer2t.jpg
  authors: "Pengfei Zhang, Deying Kong"
  description: >-
    A lightweight model using hand-level tokenization in a transformer-based
    architecture for interacting hand pose estimation, where only one token is
    used per hand. It runs at 3x the FPS with equivalent performance.
  links:
    - label: paper
      url: https://openaccess.thecvf.com/content/WACV2024/html/Zhang_Handformer2T_A_Lightweight_Regression-Based_Model_for_Interacting_Hands_Pose_Estimation_WACV_2024_paper.html

# --------------------------------------------------------------- Project II
- project: II
  ref: II.g
  title: "AP-GRPO: Anchor-Gated Phonetic Alignment with Policy Optimization for Pathological Speech Reconstruction"
  venue: "EMNLP 2026 (accepted)"
  image: /pubimages/C_apgrpo.png
  description: >-
    A GRPO framework with a phonetic reward that aligns speech language models
    through audible-anchor preservation and phonetic alignment, combining an
    anchor-gated reward that matches anchors in clear regions with an inter-anchor
    phonetic alignment reward that checks whether recovered content is phonetically
    supported by the corresponding corrupted speech span. It reduces WER by 0.39 on
    severe cases and 0.27 on medium cases, and suppresses most hallucinated
    insertions.
  links:
    - label: preprint
      url: https://arxiv.org/abs/2606.15540

- project: II
  ref: II.f
  title: "DemMA: Dementia Multi-Turn Dialogue Agent with Expert-Guided Reasoning and Action Simulation"
  venue: "ACL 2026"
  image: /pubimages/C_demma.png
  description: >-
    An expert-guided multi-turn agent that simulates dementia patients with
    clinically grounded personas by distilling expert-guided reasoning. DemMA
    achieves state-of-the-art simulation fidelity and multi-turn dialogue quality.
  links:
    - label: paper
      url: https://aclanthology.org/2026.findings-acl.605/
    - label: code
      url: https://github.com/RainieLLM/DemMA
    - label: data
      url: https://huggingface.co/datasets/hulehule/DemMA-Dialog

- project: II
  ref: II.e
  title: "MedSpeak: Knowledge Enhanced ASR Error Correction Framework for Spoken Medical Question Answering"
  venue: "ICASSP 2026"
  image: /pubimages/C_medspeak.jpg
  description: >-
    A knowledge-enhanced retrieval-augmented generation framework built on two
    knowledge graphs, one for phonetic similarity and one for semantic medical
    relationships, raising MMLU QA accuracy to 93.4%.
  links:
    - label: preprint
      url: https://arxiv.org/html/2602.00981v1
    - label: code
      url: https://github.com/RainieLLM/MedSpeak

- project: II
  ref: II.d
  title: "ADAPT: Audio-Depth Action Planning with Transition-Aware Rewards for Lights-Out Industrial Navigation"
  venue: "Under Review"
  description: >-
    An audio-depth action-planning framework with spatial-audio perception,
    optimized for closed-loop navigation through reinforcement learning. In unseen
    environments it reaches 90.6% success under clean conditions and retains 60.0%
    success under the most challenging localized-noise setting.
  links:
    - label: preprint
      url: https://arxiv.org/abs/2610.15956

- project: II
  ref: II.c
  title: "AudioLens: Multi-Perspective Speech Clustering with Audio-Language Models"
  venue: "Under Review"
  image: /pubimages/C_audiolens.png
  description: >-
    Introduces audio multi-perspective clustering, where a large audio-language
    model directly partitions speech recordings according to a natural-language
    perspective, with a benchmark spanning multiple applications and perspectives.
    The proposed AudioLens-R1, trained with reasoning distillation and direct
    preference optimization, improves overall ARI by 12.99 points and V-measure by
    11.62 points.
  links:
    - label: preprint
      url: https://arxiv.org/abs/2608.25177

- project: II
  ref: II.b
  title: "From Sounds to Scenes: A Benchmark for Evaluating Context-Aware Auditory Scene Understanding in Large Audio Language Models"
  venue: "Under Review"
  image: /pubimages/C_soundsToScenes.png
  description: >-
    A benchmark evaluating whether large audio-language models can jointly interpret
    speech, events and scene-level information to perform coherent semantic reasoning.
  links:
    - label: preprint
      url: https://arxiv.org/abs/2606.25391

- project: II
  ref: II.a
  title: "Hallucination Rates of Speech Language Models on Pathological Speech Recognition: A Pilot Multi-Cohort Audit"
  venue: "BSN 2025"
  image: /pubimages/C_hallucinationAudit.png
  description: >-
    An evaluation of popular speech language models on pathological speech
    recognition across hallucination types: insertion, fluent completion, entity
    fabrication and semantic substitution.

# -------------------------------------------------------------- Project III
- project: III
  ref: III.c
  title: "Can the Environment Speak for Itself? T2-GRPO: Turn-Trajectory Group Relative Policy Optimization for Caregiver Agents"
  venue: "Under Review"
  image: /pubimages/C_t2grpo.png
  description: >-
    A turn-trajectory optimization scheme for long-horizon caregiver agents that
    derives dense turn-level rewards from patient-state transitions, normalizes them
    separately from trajectory-level outcomes via centered-rank group-relative
    advantages, and adds a binary safety veto to enforce hard behavioral constraints.

- project: III
  ref: III.b
  title: "DEMENTIA-PLAN: An Agent-Based Framework for Multi-Knowledge Graph Retrieval-Augmented Generation in Dementia Care"
  venue: "AAAI 2025"
  image: /pubimages/C_dementialPlan2.png
  authors: "Yutong Song, Chenhan Lyu, Pengfei Zhang, Sabine Brunswicker, Nikil Dutt, Amir M. Rahmani"
  description: >-
    A retrieval-augmented generation framework that improves conversations with
    mild-stage dementia patients by integrating multiple knowledge graphs with LLMs.
  links:
    - label: preprint
      url: https://openreview.net/pdf?id=m7KkNKMDVp

- project: III
  ref: III.a
  title: "Adaptive Constraint Relaxation in Personalized Nutrition Recommendations: An LLM-Driven Knowledge Graph Retrieval Approach"
  venue: "AMIA 2025 (Oral)"
  image: /pubimages/C_adaptiveRetrieval.jpg
  authors: "Pengfei Zhang, Mohbat Fnu, Yutong Song, Oshani Seneviratne, Zhongqi Yang, Iman Azimi, Amir M. Rahmani"
  description: >-
    An LLM-driven knowledge graph retrieval system for personalized food
    recommendation, resolving the all-or-nothing limitation of traditional
    recommendation systems.
  links:
    - label: preprint
      url: http://dx.doi.org/10.13140/RG.2.2.29331.80163

