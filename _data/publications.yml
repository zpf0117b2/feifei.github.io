# ---------------------------------------------------------------- Project I
- project: I
  ref: I.e
  title: "Identity Decay in Multi-Turn Human-Centric Image Editing: A Benchmark and a Multimodal Agentic Correction Framework"
  venue: "Under Review"
  # image: /pubimages/C_identityDecay.jpg   # <- drop the file in pubimages/ and uncomment
  description: >-
    Introduces a benchmark measuring identity and fidelity decay in multi-turn
    human-centric image editing, and a correction pipeline in which a multimodal
    agent orchestrates identity correction using pretrained human segmentation and
    parsing models (Sapiens for body, DML_CSR for face) together with deterministic
    image operators such as TPS warp and high-frequency preservation transfer,
    flattening the degradation curve.

- project: I
  ref: I.d
  title: "KinMo: Kinematic-aware Human Motion Understanding and Generation"
  venue: "ICCV 2025"
  image: /pubimages/C_kinmo.jpg
  authors: "Pengfei Zhang, Pinxin Liu, Pablo Garrido, Hyeongwoo Kim, Bindita Chaudhuri"
  description: >-
    A VLM-based dataset enhancement pipeline that extends existing text-motion
    alignment datasets with a body-decomposition motion representation, enabling
    precise motion descriptions, plus a hierarchical motion-text alignment approach
    that fuses motion detail into text semantics for finer motion control.
  links:
    - label: project
      url: https://andypinxinliu.github.io/KinMo/
    - label: preprint
      url: https://arxiv.org/abs/2411.15472
    - label: demo
      url: https://andypinxinliu.github.io/KinMo/static/videos/KinMo-Demo.mp4

